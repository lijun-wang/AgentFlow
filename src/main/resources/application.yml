spring:
  application:
    name: agentflow

  datasource:
    url: ${DB_URL}
    username: postgres
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  sql:
    init:
      mode: never

  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

  ai:
    # Spring AI 模型调用重试策略（作用于 Embedding 等 Spring AI 客户端）
    retry:
      max-attempts: 5                # 最大尝试次数（含首次调用）
      backoff:
        initial-interval: 2s         # 首次重试间隔
        multiplier: 5                # 间隔倍数（指数退避：2s -> 10s -> 50s...）
        max-interval: 3m             # 重试间隔上限
      on-client-errors: false        # 4xx 客户端错误不重试（参数/认证错误重试无意义）
      exclude-on-http-codes: [401, 403, 404]  # 显式排除的 HTTP 状态码
      on-http-codes: [429, 500, 502, 503, 504]  # 触发重试的 HTTP 状态码（限流和瞬时服务端错误）
    openai:
      api-key: ${OPENAI_API_KEY}
      base-url: ${OPENAI_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode}
      embedding:
        options:
          model: text-embedding-v3

# LangChain4j Embedding 配置（通义千问 OpenAI 兼容端点）
langchain4j:
  embedding:
    base-url: ${LANGCHAIN4J_EMBEDDING_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}
    api-key: ${LANGCHAIN4J_EMBEDDING_API_KEY}
    model: ${LANGCHAIN4J_EMBEDDING_MODEL:text-embedding-v3}
    max-retries: ${LANGCHAIN4J_EMBEDDING_MAX_RETRIES:2}  # LangChain4j 内部重试次数（不含首次调用）

# DeepSeek Chat API 配置（用于智能问答总结、聊天机器人 2.0）
deepseek:
  api-key: ${DEEPSEEK_API_KEY}
  base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com}
  model: ${DEEPSEEK_MODEL:deepseek-flash}
  max-retries: ${DEEPSEEK_MAX_RETRIES:2}  # LangChain4j ChatModel 内部重试次数（不含首次调用）

# 向量搜索配置
vector-search:
  # 相似度阈值，仅返回相似度 >= 该值的结果（范围 0~1，默认 0.7 即 70%）
  similarity-threshold: 0.4

# 向量存储后端开关：postgres（pgvector）或 milvus
vector-store:
  type: ${VECTOR_STORE_TYPE:milvus}   # postgres | milvus
  milvus:
    uri: ${MILVUS_URI:}
    token: ${MILVUS_TOKEN:}              # 可选，格式 username:password；为空则用 username/password
    username: ${MILVUS_USERNAME:}
    password: ${MILVUS_PASSWORD:}
    database: ${MILVUS_DATABASE:}
    dimension: ${MILVUS_DIMENSION:}
    # 与 Postgres 表名对应的 Collection
    collection-document-chunk: document_chunk
    collection-langchain4j: document_chunk_langchain4j
    collection-v3: document_chunk_v3

# 知识图谱 3.0：按块抽取三元组
knowledge-graph:
  confidence-threshold: 0.6
  require-mention-in-chunk: true
  allowed-types: Person,Org,Concept,Location,Event,Product
  allowed-predicates: 属于,包含,依赖,导致,位于,参与,相关,任职于

server:
  port: 8081

logging:
  level:
    com.agentflow: DEBUG
    org.springframework.ai: DEBUG
